  <body>
    <div class="floating-hearts" aria-hidden="true"></div>

    <header class="site-header">

      <nav class="main-nav">

      <button class="music-toggle" type="button" id="music-toggle" aria-label="Toggle music">
        <span>♫</span> Music Off

    <main class="page-shell">
      <div class="page-header reveal">
        <p class="eyebrow">Little treasures</p>
        <h1>Sweet memories</h1>
        <p class="subtitle">The best moments are the ones that feel like warm sunshine and quiet laughter.</p>

      <div class="card-list reveal">
        <button class="story-item" type="button">
          <strong>01 — Your smile</strong>
          <span>It lights up the room faster than any sunshine ever could.</span>
        </button>
        <button class="story-item" type="button">
          <strong>02 — Your laugh</strong>
          <span>Soft, bright, and instantly calming — the kind of sound that makes everything feel better.</span>
        </button>
        <button class="story-item" type="button">
          <strong>03 — Your kindness</strong>
          <span>You carry so much warmth and gentleness, and it makes the world feel kinder.</span>
        </button>
        <button class="story-item" type="button">
          <strong>04 — Your dreams</strong>
          <span>The future looks even more beautiful with someone as brave and lovely as you in it.</span>
        </button>
      </div>

      <div class="gallery-grid reveal">
        <figure class="gallery-card">
          <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80" alt="Happy girl smiling" />
          <figcaption>That glow only you have.</figcaption>
        </figure>
        <figure class="gallery-card">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80" alt="Beautiful portrait" />
          <figcaption>Everyday moments become magical with you.</figcaption>
        </figure>
        <figure class="gallery-card">
          <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80" alt="Girl outdoors" />
          <figcaption>May your life always feel as lovely as this.</figcaption>
        </figure>
